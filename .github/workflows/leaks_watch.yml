name: Leaks & Breaking News Watch

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ai-meadi-news-history-writer
  cancel-in-progress: false

jobs:
  run-leaks-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Leaks Watch Script
        working-directory: news_bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAK_TELEGRAM_CHAT_ID: ${{ secrets.LEAK_TELEGRAM_CHAT_ID }}
        run: python leaks_main.py
      - name: Commit and Push History
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git add news_bot/posted_history.json news_bot/rejected_news.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update posted leaks/news history [skip ci]"
            git push
          fi
