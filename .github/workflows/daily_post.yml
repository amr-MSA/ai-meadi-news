name: Daily AI Content Automation

on:
  schedule:
    # يعمل كل ساعتين لاقتناص التسريبات والأخبار العاجلة
    - cron: '0 */2 * * *'
  workflow_dispatch:

# إلغاء أي تشغيل متزامن لمنع نشر الخبر مرتين عند تداخل الأوقات
concurrency:
  group: news-bot-single-run
  cancel-in-progress: true

jobs:
  run-automation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pillow google-genai

      - name: Execute Python Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ↓ هذا يأتي تلقائياً من GitHub، لا تضفه في Repository secrets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add posted_history.json report.txt report_image.jpg || true
          git commit -m "Update: report + history [skip ci]" || true
          git push || true
